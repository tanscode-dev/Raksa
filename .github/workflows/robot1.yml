name: Robot 1 - ambil pesanan BigSeller

on:
  # Jadwal 09.00 dan 13.00 WIB (Senin–Sabtu) dijalankan oleh database Business Manager
  # (pg_cron → workflow_dispatch) supaya tepat waktu; jadwal GitHub sering terlambat/terlewat
  # sejak 30/10/2026. Lihat cron.job "robot1-0900-wib" & "robot1-1300-wib".
  workflow_dispatch:
    inputs:
      rentang_hari:
        description: "Ambil pesanan berapa hari terakhir (termasuk hari ini)"
        required: false
        default: "3"

concurrency:
  group: robot1
  cancel-in-progress: false

jobs:
  robot1:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: robot
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Pasang Playwright
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Jalankan Robot 1
        env:
          SUPABASE_URL: https://huewrdenasnocclygtwv.supabase.co
          SUPABASE_SERVICE_KEY: ${{ secrets.BM_SUPABASE_SERVICE_KEY }}
          BIGSELLER_EMAIL: ${{ secrets.BIGSELLER_EMAIL }}
          BIGSELLER_PASSWORD: ${{ secrets.BIGSELLER_PASSWORD }}
          RENTANG_HARI: ${{ github.event.inputs.rentang_hari || '3' }}
          GITHUB_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: node robot1.mjs
      - name: Simpan tangkapan layar bila gagal
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: robot1-gagal
          path: robot/gagal.png
          retention-days: 7
