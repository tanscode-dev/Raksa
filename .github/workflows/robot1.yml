name: Robot 1 - ambil pesanan BigSeller

on:
  schedule:
    # 09.00 dan 13.00 WIB (= 02.00 dan 06.00 UTC), Senin–Sabtu. Minggu libur.
    # Catatan: jadwal GitHub kadang terlambat 5–15 menit.
    - cron: "0 2,6 * * 1-6"
  workflow_dispatch:
    inputs:
      rentang_hari:
        description: "Ambil pesanan berapa hari terakhir (termasuk hari ini)"
        required: false
        default: "3"

concurrency:
  group: robot1
  cancel-in-progress: false

jobs:
  robot1:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: robot
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Pasang Playwright
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Jalankan Robot 1
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          BIGSELLER_EMAIL: ${{ secrets.BIGSELLER_EMAIL }}
          BIGSELLER_PASSWORD: ${{ secrets.BIGSELLER_PASSWORD }}
          RENTANG_HARI: ${{ github.event.inputs.rentang_hari || '3' }}
          GITHUB_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: node robot1.mjs
      - name: Simpan tangkapan layar bila gagal
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: robot1-gagal
          path: robot/gagal.png
          retention-days: 7
