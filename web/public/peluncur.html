function modeUnduh(prm){var tok=prm.get("token"),part=prm.get("part");document.title="Unduh file Raksa";document.getElementById("info").textContent="Mengambil file "+(part==="tambah"?"penambahan":"pengurangan")+" stok dari peluncur.";
 if(!/^[a-z0-9]{4,20}$/.test(tok||"")||(part!=="tambah"&&part!=="kurang")){say("Perintah tidak valid.","bad");return}
 var bc=new BroadcastChannel("raksa-robot"),sudah=false;

 function simpan(buf){var url=URL.createObjectURL(new Blob([buf],{type:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"})),a=document.createElement("a");a.href=url;a.download=nmF;document.body.appendChild(a);a.click();say("File diunduh: "+a.download)}
 try{var ls=localStorage.getItem("raksa-"+tok+"-"+part);if(ls){sudah=true;localStorage.removeItem("raksa-"+tok+"-"+part);simpan(dariB64(ls));return}}catch(e){}
 bc.onmessage=function(ev){var d=ev.data||{};if(d.type!=="file"||d.token!==tok||d.part!==part||sudah)return;sudah=true;if(!d.buf){say("File tidak tersedia di peluncur.","bad");return}simpan(d.buf)};
 var n=0;(function minta(){if(sudah)return;bc.postMessage({type:"minta",token:tok,part:part});if(++n>20){say("Peluncur tidak menjawab. Pastikan tab Peluncur Robot Raksa masih terbuka.","bad");return}setTimeout(minta,700)})();

function b64(buf){var u=new Uint8Array(buf),r="";for(var i=0;u.length>i;i+=32768)r+=String.fromCharCode.apply(null,u.subarray(i,i+32768));return btoa(r)}

 if(!/^[a-z0-9]{4,20}$/.test(tok||"")||nt+nk<1){say("Perintah tidak valid. Jalankan ulang dari Raksa.","bad");return}

 window.addEventListener("message",function(ev){if(ev.origin!==RAKSA_ORIGIN)return;var d=ev.data||{};if(d.type!=="raksa-stok-file"||d.token!==tok||files!==null)return;
  if(!d.ada){files=false;say("Data batch tidak ditemukan di Raksa. Muat ulang Raksa lalu jalankan ulang.","bad");return}
  files={tambah:d.tambah,kurang:d.kurang};
  var meta={lbl:d.lbl||null,nama:d.nama||null};try{["tambah","kurang"].forEach(function(x){if(files[x]){localStorage.setItem("raksa-"+tok+"-"+x,b64(files[x]));if(meta.nama&&meta.nama[x])localStorage.setItem("raksa-"+tok+"-"+x+"-nama",meta.nama[x].replace(/[\\\/:*?"<>|']/g,""))}})}catch(e){}
  var bc=new BroadcastChannel("raksa-robot");bc.onmessage=function(e){var m=e.data||{};if(m.type==="minta"&&m.token===tok&&(m.part==="tambah"||m.part==="kurang"))bc.postMessage({type:"file",token:tok,part:m.part,buf:files[m.part]||null})};
  json=makroStok(tok,d.nt,d.nk,folder,uji,meta);done=false;n=0;

  say("File stok diterima dari Raksa. Mengirim perintah ke UI.Vision\u2026");tunggu()});
 (function minta(){if(files!==null)return;keRaksa({type:"raksa-minta-stok",token:tok});if(++k>15){say("Raksa tidak mengirim file. Muat ulang Raksa lalu jalankan ulang.","bad");return}setTimeout(minta,800)})();
 say("Meminta file stok dari Raksa\u2026")}

if(!location.hash){say("Buka halaman ini lewat tombol Jalankan Robot di Raksa.","warn");return}
history.replaceState(null,"",location.pathname);
folder=folder.trim().replace(/^["']+|["']+$/g,"").trim().replace(/[\\\/]+$/,"");if(!/^[A-Za-z]:[\\\/][^<>|?*"]*$/.test(folder)&&!/^\/[^<>|?*"]*$/.test(folder)){say("Folder Download tidak valid: "+folder+" . Periksa di Raksa (contoh: C:\\Users\\Nama\\Downloads).","bad");return}
if(robot==="stok"){mulaiStok(p.get("token"),+p.get("nt")||0,+p.get("nk")||0,folder,p.get("uji")==="1");return}
if(robot!=="pesanan"||!ok(dari)||!ok(sampai)||dari>sampai){say("Perintah tidak valid. Jalankan ulang dari Raksa.","bad");return}
var hari=(new Date(sampai)-new Date(dari))/864e5;
if(hari>92){say("Rentang tanggal maksimal 93 hari.","bad");return}
var fmt=function(d){return d.split("-").reverse().join("/")};
document.getElementById("info").textContent="Robot 1: impor pesanan "+fmt(dari)+" s/d "+fmt(sampai)+".";
var json=makroPesanan(dari,sampai,folder),done=false,n=0;
var hasil=document.getElementById("hasil"),tungguRaksa=null,tungguTerima=null,diterima=false;
function tutup(ms){setTimeout(function(){try{window.close()}catch(e){}},ms)}
document.addEventListener("visibilitychange",function(){if(document.hidden&&diterima)tutup(300)});
function setHasil(h,baru,pesan){hasil.setAttribute("data-baru",String(baru||0));hasil.setAttribute("data-pesan",pesan||"");hasil.setAttribute("data-hasil",h)}
window.addEventListener("message",function(ev){if(ev.origin!==RAKSA_ORIGIN)return;var d=ev.data||{};if(d.type==="raksa-upload-diterima"){clearTimeout(tungguTerima);diterima=true;if(document.hidden)tutup(300);say("Raksa menerima file ("+Math.round((d.ukuran||0)/1024)+" KB), sedang memproses…");return}if(d.type!=="raksa-upload-hasil")return;clearTimeout(tungguRaksa);
 if(d.hasil==="OK"){setHasil("OK",d.baru,"");say("Selesai: file masuk Raksa ("+(d.baru||0)+" pesanan baru, "+(d.berubah||0)+" status berubah). Tab ini akan tertutup sendiri.");tutup(2500)}
 else{setHasil("GAGAL",0,d.pesan||"Raksa gagal membaca file");say("Raksa gagal membaca file: "+(d.pesan||""),"bad")}});
document.getElementById("pilih").addEventListener("click",function(){document.getElementById("rkfile").click()});
function infoFile(){var v=document.getElementById("rkinfo").value;if(!v)return;if(v==="SELESAI-STOK"){say("Robot 2 selesai. Hasilnya tampil di Raksa. Tab ini akan tertutup.");tutup(800);return}var nf=document.getElementById("namafile");nf.hidden=false;nf.textContent="File terunduh: "+v;say("File terunduh. Menyerahkan ke Raksa…")}
document.getElementById("rkinfo").addEventListener("input",infoFile);document.getElementById("rkinfo").addEventListener("change",infoFile);
document.getElementById("rkfile").addEventListener("change",function(){var f=this.files&&this.files[0];if(!f)return;
 if(!window.opener){setHasil("GAGAL",0,"Tab Raksa tidak terhubung. Jalankan ulang dari tombol di Raksa.");say("Tab Raksa tidak terhubung. Jalankan ulang dari tombol di Raksa.","bad");return}
 say("Menyerahkan "+f.name+" ke Raksa…");
 f.arrayBuffer().then(function(buf){var msg={type:"raksa-upload",name:f.name,buf:buf,token:TOKEN};
  try{window.opener.postMessage(msg,RAKSA_ORIGIN)}catch(e){}
  tungguTerima=setTimeout(function(){say("File tidak sampai ke tab Raksa. Muat ulang tab Raksa lalu jalankan ulang dari tombol di Raksa.","bad")},10000);
  tungguRaksa=setTimeout(function(){setHasil("GAGAL",0,"Raksa tidak menjawab. Pastikan tab Raksa masih terbuka.");say("Raksa tidak menjawab. Pastikan tab Raksa masih terbuka.","bad")},90000)})});
window.addEventListener("kantuInvokeSuccess",function(){if(done)return;done=true;document.getElementById("manual").hidden=false;say("Perintah diterima UI.Vision. Robot berjalan. Jangan tutup tab ini dan tab Raksa sampai selesai.")});
function kirim(){try{window.dispatchEvent(new CustomEvent("kantuSaveAndRunMacro",{detail:{json:json,direct:true,closeRPA:0,storageMode:"browser"}}))}catch(e){}}
function tunggu(){if(done)return;n++;
 if(document.documentElement.getAttribute("data-kantu")){say("Mengirim perintah ke UI.Vision…");kirim();
  setTimeout(function(){if(!done){kirim();setTimeout(function(){if(!done)say("UI.Vision tidak merespons. Cek pengaturan UI.Vision lalu jalankan ulang dari Raksa.","bad")},6000)}},6000);return}
 if(n>=20){say("UI.Vision belum siap di halaman ini. Pastikan ekstensinya aktif, izin menjalankan makro dari website menyala, dan alamat Raksa ada di whitelist UI.Vision. Lalu jalankan ulang dari Raksa.","warn");return}
 setTimeout(tunggu,500)}
say("Menunggu UI.Vision…");setTimeout(tunggu,300);
})();
</script>
