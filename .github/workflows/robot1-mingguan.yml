name: Robot 1 Mingguan - perbarui status pesanan 30 hari

# Robot 1 yang sama, khusus hari Minggu: mengambil pesanan BigSeller 30 hari terakhir
# supaya status pesanan lama (selesai, batal, pengembalian) ikut diperbarui di Raksa.
# Jadwal harian Robot 1 (Senin–Sabtu, 3 hari) dan Robot 2 tidak berubah.

on:
  schedule:
    # 10.00 WIB hari Minggu (= 03.00 UTC). Jadwal GitHub kadang terlambat 5–15 menit.
    - cron: "0 3 * * 0"
  workflow_dispatch:

concurrency:
  group: robot1
  cancel-in-progress: false

jobs:
  robot1-mingguan:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: robot
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Pasang Playwright
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Jalankan Robot 1 (30 hari)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          BIGSELLER_EMAIL: ${{ secrets.BIGSELLER_EMAIL }}
          BIGSELLER_PASSWORD: ${{ secrets.BIGSELLER_PASSWORD }}
          RENTANG_HARI: "30"
          TUNGGU_EKSPOR_MENIT: "20"
          GITHUB_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: node robot1.mjs
      - name: Simpan tangkapan layar bila gagal
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: robot1-mingguan-gagal
          path: robot/gagal.png
          retention-days: 7
